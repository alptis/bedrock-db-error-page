<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Service temporarily unavailable</title>
    <style>
        :root { color-scheme: light; --text: #1f2937; --muted: #6b7280; --bg: #f3f4f6; --card: #ffffff; --border: #e5e7eb; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        main { width: min(100%, 32rem); padding: 2rem; background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; }
        h1 { margin: 0 0 1rem; font-size: 1.375rem; font-weight: 600; line-height: 1.3; }
        p { margin: 0 0 0.75rem; color: var(--muted); font-size: 0.9375rem; }
        p:last-child { margin-bottom: 0; }
    </style>
</head>
<body>
<main>
    <h1>Service temporarily unavailable</h1>
    <p>The site is currently experiencing technical difficulties.</p>
    <p>Please try again in a few minutes.</p>
</main>
</body>
</html>
